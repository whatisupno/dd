services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: dev-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/backups:ro

volumes:
  sqldata:
